<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework Helper</title>
  <link rel="stylesheet" href="../shared/engine-picker.css">
  <link rel="stylesheet" href="../shared/translate-history-sheet.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pop-container">
    <header class="pop-header">
      <div class="pop-brand">
        <div id="popLogo" class="pop-logo"></div>
        <div>
          <div class="pop-title">Homework Helper</div>
          <div class="pop-sub" id="popBrandSub">Zero-Login Academic AI</div>
        </div>
      </div>
      <div class="pop-header-actions">
        <button class="pop-icon-btn" id="popBtnHistory" title="History"></button>
        <button class="pop-icon-btn" id="popBtnShortcuts" title="Keyboard Shortcuts"></button>
        <button class="pop-icon-btn" id="popBtnOptions" title="Settings"></button>
      </div>
    </header>

    <!-- Keyboard Shortcuts panel — toggled by #popBtnShortcuts (popup.js) -->
    <div class="pop-shortcuts-backdrop" id="popShortcutsBackdrop" hidden></div>
    <div class="pop-shortcuts-panel" id="popShortcutsPanel" hidden>
      <div class="pop-shortcuts-header">
        <span id="popShortcutsTitle">Keyboard Shortcuts</span>
        <button class="pop-icon-mini" id="popBtnCloseShortcuts"></button>
      </div>
      <div class="pop-shortcuts-list" id="popShortcutsList"></div>
    </div>

    <div class="pop-body">
      <!-- Language pair -->
      <div class="pop-lang-row">
        <select class="pop-select" id="popLangFrom"></select>
        <button class="pop-swap-btn" id="popBtnSwap" title="Swap"></button>
        <select class="pop-select" id="popLangTo"></select>
      </div>

      <!-- Engine picker -->
      <div class="pop-engine-row">
        <span class="pop-engine-label" id="popEngineLabel">Engine:</span>
        <div class="pop-engine-picker" id="popEnginePicker"></div>
      </div>

      <!-- Source text -->
      <div class="pop-field">
        <textarea id="popInput" class="pop-textarea" rows="2" placeholder="Type or paste text..."></textarea>
        <div class="pop-field-actions">
          <button class="pop-icon-mini" id="popBtnSpeakSource" title="Listen" hidden></button>
          <button class="pop-clear-btn" id="popBtnClear" title="Clear" hidden></button>
        </div>
      </div>

      <div class="pop-hint" id="popInputHint"></div>

      <div class="pop-note" id="popClipboardNote" hidden>
        <span id="popClipboardNoteText"></span>
      </div>

      <button class="pop-translate-btn" id="popBtnTranslate">
        <span id="popIconTranslate"></span>
        <span id="popBtnTranslateText">Translate</span>
      </button>

      <!-- Result -->
      <div class="pop-result-box" id="popResultBox" hidden>
        <div class="pop-result-head">
          <span class="pop-result-meta" id="popResultMeta"></span>
          <button class="pop-icon-mini" id="popBtnFavorite" title="Favorite" hidden></button>
          <button class="pop-icon-mini" id="popBtnSpeakResult" title="Listen" hidden></button>
          <button class="pop-link-btn" id="popBtnCopy"></button>
        </div>
        <div class="pop-result-body" id="popResult"></div>
      </div>

      <div class="pop-error" id="popError" hidden></div>

      <div class="pop-divider"></div>

      <!-- Quick actions -->
      <div class="pop-widgets">
        <button class="pop-widget" id="popWidgetChat">
          <span class="pop-widget-icon" id="popIconChat"></span>
          <span class="pop-widget-text" id="popWidgetChatText">AI Chat</span>
        </button>
        <button class="pop-widget" id="popWidgetCapture">
          <span class="pop-widget-icon" id="popIconCapture"></span>
          <span class="pop-widget-text" id="popWidgetCaptureText">Crop &amp; Solve</span>
        </button>
        <button class="pop-widget" id="popWidgetHover">
          <span class="pop-widget-icon" id="popIconHover"></span>
          <span class="pop-widget-text" id="popWidgetHoverText">Hover Translate</span>
        </button>
        <button class="pop-widget" id="popWidgetSettings">
          <span class="pop-widget-icon" id="popIconSettings"></span>
          <span class="pop-widget-text" id="popWidgetSettingsText">Settings</span>
        </button>
      </div>

      <!-- Feature toggles -->
      <div class="pop-toggles">
        <label class="pop-toggle-row">
          <span id="popLabelForms">Google Forms Assistant</span>
          <input type="checkbox" id="popToggleForms" checked>
        </label>
        <label class="pop-toggle-row">
          <span id="popLabelTooltip">Selection Tooltip (Highlight Text)</span>
          <input type="checkbox" id="popToggleTooltip" checked>
        </label>
        <label class="pop-toggle-row">
          <span id="popLabelAutoClipboard">Auto-translate clipboard</span>
          <input type="checkbox" id="popToggleAutoClipboard" checked>
        </label>
      </div>
    </div>

    <footer class="pop-footer">
      <button class="pop-btn-settings" id="popBtnConfigure">
        <span id="popIconGear"></span> <span id="popConfigureBtnText">Configure Models &amp; Keys</span>
      </button>
      <span class="pop-status" id="popKeyStatus"></span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
