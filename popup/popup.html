<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pop-container">
    <header class="pop-header">
      <div class="pop-brand">
        <div id="popLogo" class="pop-logo"></div>
        <div>
          <div class="pop-title">Homework Helper</div>
          <div class="pop-sub">Zero-Login Academic AI</div>
        </div>
      </div>
      <button class="pop-icon-btn" id="popBtnOptions" title="Settings"></button>
    </header>

    <div class="pop-body">
      <!-- Quick Action Cards -->
      <button class="pop-card-btn pop-card-primary" id="popBtnOpenSidePanel">
        <span id="popIconSidePanel"></span>
        <div class="pop-btn-text">
          <span class="pop-btn-title">Open AI Side Panel</span>
          <span class="pop-btn-desc">Workspace alongside any webpage</span>
        </div>
      </button>

      <button class="pop-card-btn" id="popBtnCapture">
        <span id="popIconCapture"></span>
        <div class="pop-btn-text">
          <span class="pop-btn-title">Crop & Solve (Alt+C)</span>
          <span class="pop-btn-desc">Snip formulas or diagrams</span>
        </div>
      </button>

      <!-- Key Rotation Status -->
      <div class="pop-status-box">
        <div class="pop-status-row">
          <span class="pop-label">Active Keys Pool:</span>
          <span class="pop-badge" id="popKeyCount">0 Keys</span>
        </div>
        <div class="pop-status-row">
          <span class="pop-label">Rotation Mode:</span>
          <span class="pop-value" id="popRotationMode">Round Robin</span>
        </div>
      </div>

      <!-- Feature Toggles -->
      <div class="pop-toggles">
        <label class="pop-toggle-row">
          <span>Google Forms Assistant</span>
          <input type="checkbox" id="popToggleForms" checked>
        </label>
        <label class="pop-toggle-row">
          <span>Selection Tooltip (Highlight Text)</span>
          <input type="checkbox" id="popToggleTooltip" checked>
        </label>
      </div>
    </div>

    <footer class="pop-footer">
      <button class="pop-btn-settings" id="popBtnConfigure">
        <span id="popIconGear"></span> Configure Models & Keys
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
